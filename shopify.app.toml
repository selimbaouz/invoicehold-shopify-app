# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "cf8bcdeeeb277bd93580b22fe8d9b23e"
application_url = "https://invoicehold-shopify-app-production.up.railway.app"
embedded = true
name = "InvoiceHold"

[access_scopes]
# write_draft_orders is required for draftOrderUpdate (reserveInventoryUntil).
scopes = "write_draft_orders"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/draft-orders"
  topics = [ "draft_orders/create", "draft_orders/update" ]
  # Omit email/address so the payload is not level-2 PII. Draft orders as a
  # topic still require Protected customer data access in Partner Dashboard.
  include_fields = [
    "id",
    "admin_graphql_api_id",
    "name",
    "status",
    "invoice_sent_at",
    "line_items",
  ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/draft-orders/delete"
  topics = [ "draft_orders/delete" ]
  include_fields = [ "id", "admin_graphql_api_id", "name", "status" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [ "https://invoicehold-shopify-app-production.up.railway.app/api/auth" ]

[build]
automatically_update_urls_on_dev = true
